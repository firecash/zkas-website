<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZKas Growth Fund</title>
<meta name="description" content="The ZKas growth fund, updated live.">
<style>
  :root{
    --bg:#0a0f0d; --card:#101614; --line:#1d2a26;
    --mint:#18d8bd; --text:#e6f2ef; --dim:#7d938d; --amber:#f1ba70;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:48px 20px; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:760px; margin:0 auto}
  h1{font-size:28px; margin:0 0 6px; letter-spacing:-.02em}
  .sub{color:var(--dim); margin:0 0 36px; font-size:15px}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:22px 24px;
  }
  .label{color:var(--dim); font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px}
  .amount{font-size:30px; font-weight:600; letter-spacing:-.02em; word-break:break-all}
  .unit{font-size:15px; color:var(--mint); margin-left:6px; font-weight:500}
  .usd{color:var(--dim); font-size:15px; margin-top:6px}
  .total{margin-top:16px; border-color:#24443c}
  .total .amount{color:var(--mint)}
  .meta{
    margin-top:28px; padding-top:20px; border-top:1px solid var(--line);
    color:var(--dim); font-size:14px;
  }
  .meta div{margin-bottom:6px}
  .err{color:var(--amber)}
  a{color:var(--mint)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ZKas Growth Fund</h1>

  <div class="grid">
    <div class="card">
      <div class="label">ZKAS in the fund</div>
      <div class="amount" id="zkas">—<span class="unit">ZKAS</span></div>
      <div class="usd" id="zkas-usd">&nbsp;</div>
    </div>
    <div class="card">
      <div class="label">KAS reserve</div>
      <div class="amount" id="kas">—<span class="unit">KAS</span></div>
      <div class="usd" id="kas-usd">&nbsp;</div>
    </div>
    <div class="card">
      <div class="label">USDT reserve</div>
      <div class="amount" id="usdt">—<span class="unit">USDT</span></div>
      <div class="usd">&nbsp;</div>
    </div>
    <div class="card">
      <div class="label">Spent USDT</div>
      <div class="amount" id="usdt-spent">—<span class="unit">USDT</span></div>
      <div class="usd">&nbsp;</div>
    </div>
  </div>

  <div class="card total">
    <div class="label">Combined value</div>
    <div class="amount" id="total">—</div>
    <div class="usd">ZKAS valued at the best bid on the desk — what it would actually fetch if sold. USDT at face value.</div>
  </div>

  <div class="meta">
    <div id="rates">&nbsp;</div>
    <div id="asof">Loading…</div>
    <div>New to the desk? <a href="/guide/otc/">Read the guide</a>.</div>
  </div>
</div>

<script>
// The desk runs on a different host, so this reads its public endpoint directly.
// Aggregate figures only — no balances, no identities.
var SOURCE = 'https://mining-pool.zkas.info/api/otc/reserves';

// The fund's stablecoin side. It lives off-chain of the desk, so nothing in
// the endpoint can know it — stated here by hand and kept current.
var USDT_BALANCE = 1291;   // still held (1691 - 400 spent)
var USDT_SPENT   = 3400;   // already spent (3000 NonKYC listing + 400)

// Every figure below is coerced with Number() before it is formatted, so no
// string off the wire is ever written into the page.
function set(id, html) { document.getElementById(id).innerHTML = html; }

function render(d) {
  // The fund's own ZKAS balance, read from its wallet. On-desk figures are
  // deliberately not shown: this page is the fund, not the desk's books.
  var z = d.fees && d.fees.ZKAS ? d.fees.ZKAS : {};
  var fund = z.growthFund === undefined ? NaN : Number(z.growthFund);
  set('zkas', (isNaN(fund) ? '—' : fund.toLocaleString(undefined, {maximumFractionDigits: 2})) +
      '<span class="unit">ZKAS</span>');

  var zkasUsd = d.rates && d.rates.zkasUsd ? Number(d.rates.zkasUsd) : null;
  var fundUsd = (!isNaN(fund) && zkasUsd) ? fund * zkasUsd : null;
  var note = [];
  if (fundUsd !== null) note.push('≈ $' + fundUsd.toLocaleString(undefined, {maximumFractionDigits: 0}));
  // Say plainly when the wallet is still catching up, rather than letting a
  // stale or partial figure read as final.
  if (!isNaN(fund) && !z.growthFundSynced) note.push('wallet syncing');
  set('zkas-usd', note.length ? note.join(' · ') : '&nbsp;');

  // KAS held by the desk from fees.
  var k = d.fees && d.fees.KAS ? d.fees.KAS : {};
  var kas = k.amount === undefined ? NaN : Number(k.amount);
  var kasUsd = d.rates && d.rates.kasUsd ? Number(d.rates.kasUsd) : null;
  var kasVal = (!isNaN(kas) && kasUsd) ? kas * kasUsd : null;
  set('kas', (isNaN(kas) ? '—' : kas.toLocaleString(undefined, {maximumFractionDigits: 2})) +
      '<span class="unit">KAS</span>');
  set('kas-usd', kasVal !== null ? '≈ $' + kasVal.toLocaleString(undefined, {maximumFractionDigits: 0}) : '&nbsp;');

  set('usdt', USDT_BALANCE.toLocaleString() + '<span class="unit">USDT</span>');
  set('usdt-spent', USDT_SPENT.toLocaleString() + '<span class="unit">USDT</span>');

  // What the fund holds now: its ZKAS at the bid, plus KAS at spot, plus the USDT still in hand.
  // Spent USDT is shown above but is not part of it.
  var combined = (fundUsd || 0) + (kasVal || 0) + USDT_BALANCE;
  set('total', (fundUsd === null && kasVal === null) ? '—'
    : '≈ $' + combined.toLocaleString(undefined, {maximumFractionDigits: 0}));

  if (zkasUsd) {
    set('rates', '1 ZKAS ≈ $' + zkasUsd.toFixed(6) +
        (d.rates.zkasKas ? ' · ' + Number(d.rates.zkasKas).toFixed(8) + ' KAS' : ''));
  }
  set('asof', 'Updated ' + new Date(d.asOf).toLocaleString() + ' · refreshes every 30s');
}

function load() {
  fetch(SOURCE, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      // Say the figures are unavailable rather than leaving stale ones looking live.
      set('asof', '<span class="err">Could not reach the desk (' + e.message + '). Retrying…</span>');
    });
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
